services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/purchases
      SPRING_DATASOURCE_USERNAME: purchases
      SPRING_DATASOURCE_PASSWORD: purchases
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purchases
      POSTGRES_USER: purchases
      POSTGRES_PASSWORD: purchases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchases"]
      interval: 5s
      timeout: 3s
      retries: 5
